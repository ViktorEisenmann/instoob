name: Instoob offline checks

on:
  push:
    branches: [main]
    paths:
      - "main.py"
      - "src/**"
      - "tests/**"
      - ".github/workflows/test.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Validate Python syntax
        run: python -m compileall -q main.py setup_youtube.py scripts src tests

      - name: Run offline Instagram API unit tests
        run: python -m unittest discover -s tests -v
