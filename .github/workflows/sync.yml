name: LIMIAR LAB - Reels to Shorts

on:
  workflow_dispatch:
  schedule:
    - cron: "17 */6 * * *" # Every 6 hours (UTC), avoiding top-of-hour congestion

permissions:
  contents: write

concurrency:
  group: instoob-sync
  cancel-in-progress: false

jobs:
  sync:
    # Explicit activation prevents scheduled uploads until credentials and test are ready.
    if: ${{ vars.SYNC_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check required secrets
        env:
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
          IG_SESSION_ID: ${{ secrets.IG_SESSION_ID }}
        run: |
          for name in YOUTUBE_CLIENT_ID YOUTUBE_CLIENT_SECRET YOUTUBE_REFRESH_TOKEN IG_SESSION_ID; do
            if [ -z "${!name}" ]; then
              echo "::error::Missing GitHub Actions secret: $name"
              exit 1
            fi
          done

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Sync Instagram Reels to private YouTube Shorts
        env:
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
          IG_SESSION_ID: ${{ secrets.IG_SESSION_ID }}
        run: python main.py sync

      - name: Commit sync state
        run: |
          git config user.name "instoob-bot"
          git config user.email "instoob-bot@users.noreply.github.com"
          git add data/synced.json
          if ! git diff --staged --quiet; then
            git commit -m "sync: update LIMIAR LAB reel history [skip ci]"
            git push
          fi
